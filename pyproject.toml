[project]
name = "lightweight-airflow-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konrad Borowiec", email = "konrad.borowiec@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "oracledb==4.0.2",
    "pydantic==2.13.4",
    "csv-processor",
    "faker==40.37.0",
    "pyyaml==6.0.3",
]

[project.scripts]
lightweight-airflow-etl = "lightweight_airflow_etl:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/` is a namespace package (no `__init__.py` at the `tools/` level,
# matching the reference repo's own convention) living at the repo root, not
# under `packages/` or `src/` -- unlike csv_processor (installed via the uv
# workspace) it is never `pip install`-ed, so pytest needs the repo root on
# sys.path to resolve `import tools.corpus...`. `python -m tools.corpus` gets
# this for free (```-m``` always prepends cwd); pytest does not, hence this.
pythonpath = ["."]

# csv_processor is imported directly by local pytest/generate_csv.py/tools.corpus runs
# (Phase 2's own RESEARCH.md Pitfall 1 -- this is the root pyproject.toml's own piece of
# the three-place dependency rule). uv workspace makes packages/csv-processor an editable
# local dependency here; this has NO effect on the Airflow container, which installs the
# same package separately via docker/airflow/Dockerfile's own `pip install --no-deps` line.
[tool.uv.sources]
csv-processor = { workspace = true }

[tool.uv.workspace]
members = ["packages/csv-processor"]
