x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # D-11: Oracle Connection registered purely for UI visibility (`airflow connections
    # list`/`test`) -- csv_processor itself never touches this Connection object and stays
    # Airflow-agnostic (ENGINE-09); hostname is `oracle`, the compose service name (container-
    # internal DNS), not `localhost`.
    AIRFLOW_CONN_ORACLE_DEFAULT: "oracle://admin:admin@oracle:1521/?service_name=FREEPDB1&encoding=UTF-8&threaded=False&events=False"
    # Airflow 3 defaults `core.test_connection` to "Disabled" (a deliberate security default,
    # since the test-connection endpoint can be used to probe internal network reachability) --
    # enabled here for local-dev verification of D-11/oracle_default via
    # `airflow connections test`. Acceptable in this project's explicit local-dev-only scope.
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
  volumes:
    - ./docker/airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
    - ./airflow/dags:/opt/airflow/dags
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    oracle:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  oracle:
    image: gvenzl/oracle-free:23.26.2-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-admin}
      APP_USER: ${ORACLE_APP_USER:-admin}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-admin}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command: db migrate
    environment:
      <<: *airflow-common-env

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer

volumes:
  postgres-db-volume:
  oracle-data:
