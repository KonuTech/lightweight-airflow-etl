x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Phase 6's own newly-discovered gap (found via PR #1's real, genuinely-fresh
    # oracle-e2e run -- no prior phase ever tested a truly cold metadata DB, only
    # an already-long-warm one where a DAG had been manually unpaused once and
    # stayed that way). Airflow's default `dags_are_paused_at_creation: True`
    # means a DAG freshly discovered on a brand-new metadata DB starts PAUSED,
    # and the scheduler will not schedule ANY task instances for a paused DAG's
    # run -- not even a manually/API-triggered one. Confirmed live: the exact
    # HTTP-triggered run this project's TEST-03/D-08 e2e proof depends on stayed
    # at task state `None` forever until the DAG was unpaused; unpausing alone
    # (no restart) let the same stuck run complete within seconds. Without this,
    # DOC-01's "fresh clone to a completed HTTP-triggered ingestion, no
    # undocumented manual steps" claim would silently break for every real new
    # developer, not just CI.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Phase 5's own newly-discovered gap (found via a real live-triggered DAG run --
    # no prior phase ever actually executed a task, so this was never exercised before):
    # Airflow 3's Task SDK has every task subprocess call back into a Task Execution API
    # server to report status. The default (core.execution_api_server_url unset) resolves
    # to "http://localhost:8080/execution/" -- correct only for a single-container install.
    # In this project's multi-container compose stack, `localhost` inside
    # airflow-scheduler/airflow-triggerer does NOT route to the airflow-apiserver
    # container; every task previously failed immediately with a SIGKILL'd subprocess and
    # httpx.ConnectError: [Errno 111] Connection refused. `airflow-apiserver` (the compose
    # service name) is the correct container-internal hostname.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    # Companion gap to the above: each Airflow container auto-generates its own random
    # api_auth.jwt_secret (airflow.api_fastapi.auth.tokens.get_signing_key("api_auth",
    # "jwt_secret", ...)) on first start when unset -- fine for a single-container install,
    # but in this multi-container compose stack it means airflow-scheduler signs a task's
    # Task Execution API JWT with ITS random key while airflow-apiserver verifies it with A
    # DIFFERENT random key, always failing with "Invalid auth token" (403). Every component
    # that mints or verifies these tokens must share the identical jwt_secret.
    # Local-dev-only value (not sensitive -- this stack is 127.0.0.1-bound, INFRA-03 scope).
    AIRFLOW__API_AUTH__JWT_SECRET: "csv-ingest-local-dev-shared-jwt-secret-not-for-prod"
    # D-11: Oracle Connection registered purely for UI visibility (`airflow connections
    # list`/`test`) -- csv_processor itself never touches this Connection object and stays
    # Airflow-agnostic (ENGINE-09); hostname is `oracle`, the compose service name (container-
    # internal DNS), not `localhost`.
    AIRFLOW_CONN_ORACLE_DEFAULT: "oracle://${ORACLE_APP_USER:-admin}:${ORACLE_APP_USER_PASSWORD:-admin}@oracle:1521/?service_name=FREEPDB1&encoding=UTF-8&threaded=False&events=False"
    # Phase 5 Pattern 4/Pitfall 2: csv_processor.load's oracle_dsn()/oracle_user()/
    # oracle_password() read these three names directly (env-var-first, INFRA-03) --
    # without them, process_csv_task falls back to oracle_dsn()'s "localhost:1521/FREEPDB1"
    # default, which does not resolve to the `oracle` compose service from inside an
    # Airflow container. `oracle` (not `localhost`) is the compose-network hostname.
    ORACLE_DSN: "oracle:1521/FREEPDB1"
    ORACLE_APP_USER: "${ORACLE_APP_USER:-admin}"
    ORACLE_APP_USER_PASSWORD: "${ORACLE_APP_USER_PASSWORD:-admin}"
    # Phase 5's own newly-discovered gap: airflow-init only runs `db migrate`, and
    # Airflow 3.x's release notes confirm default connections (including fs_default)
    # are no longer auto-created during migration -- FileSensor's FSHook(fs_conn_id=
    # "fs_default") raises AirflowNotFoundException if no such connection exists at all.
    AIRFLOW_CONN_FS_DEFAULT: "fs://"
    # Airflow 3 defaults `core.test_connection` to "Disabled" (a deliberate security default,
    # since the test-connection endpoint can be used to probe internal network reachability) --
    # enabled here for local-dev verification of D-11/oracle_default via
    # `airflow connections test`. Acceptable in this project's explicit local-dev-only scope.
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
    # 07-03-PLAN.md Task 2's own newly-discovered gap (found via a real live
    # deferral of the new report_ready DAG's custom trigger -- no prior phase
    # ever exercised a DAG-folder-relative import from the triggerer process,
    # only from DAG-parsing, which Airflow's own DagFileProcessor already puts
    # on sys.path for free). The triggerer reconstructs a deferred trigger via
    # `importlib.import_module()` on its stored classpath string
    # ("_common.oracle_partition_trigger.OraclePartitionReadyTrigger") -- a
    # plain top-level-package import, unlike DAG parsing, which never adds
    # /opt/airflow/dags to sys.path on its own. Without this, every deferred
    # OraclePartitionReadyTrigger fails immediately with
    # `ModuleNotFoundError: No module named '_common'`, observed live in
    # airflow-triggerer's own logs.
    PYTHONPATH: "/opt/airflow/dags"
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./docker/airflow/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
    - ./airflow/dags:/opt/airflow/dags
    # D-06: generate_csv.py writes to ./data/<dataset>/ on the host; mounted here
    # so Phase 5's DAG can read the same files from inside the container.
    - ./data:/opt/airflow/data
    # Phase 5's own newly-discovered gap: configs/ was never mounted into the Airflow
    # containers at all, so load_config_task could never read
    # /opt/airflow/configs/datasets/<dataset>.json without this.
    - ./configs:/opt/airflow/configs:ro
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    oracle:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  oracle:
    image: gvenzl/oracle-free:23.26.2-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-admin}
      APP_USER: ${ORACLE_APP_USER:-admin}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-admin}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    command: db migrate
    environment:
      <<: *airflow-common-env

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-db-volume:
  oracle-data:
