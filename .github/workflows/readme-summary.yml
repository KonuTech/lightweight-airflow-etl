# D-11/D-12/D-13: regenerate README.md's live Executive Summary after every
# push to `master` -- re-runs a real ingestion, captures the deferred-wake
# proof, queries Oracle for the customers-JOIN-orders business report
# (scripts/regenerate_readme_summary.py), and lands the refreshed section
# back on `master` via a PR this same job opens and auto-merges.
#
# Trust boundary (T-06-07/T-06-08/T-06-09, threat_model in 06-04-PLAN.md):
# `push: branches: [master]` only -- runs after a PR's required checks already
# passed and merged, never on untrusted fork PR code. `permissions:
# contents: write`/`pull-requests: write` are scoped to ONLY this job (never
# workflow-level) -- kept separate from ci.yml's `lint-type-unit`/
# `oracle-e2e` jobs (which run on untrusted forks and have no `permissions:`
# block at all).
#
# Why a PR, not a direct push: `master`'s branch protection requires
# `lint-type-unit`/`oracle-e2e` to pass on every ref update, including a
# direct push -- but those checks only ever run via ci.yml's `pull_request`
# trigger, so a bot pushing straight to `master` can never satisfy them
# (confirmed live 2026-08-30: GH006 "Protected branch update failed ...
# 2 of 2 required status checks are expected"). GitHub Actions app bypass
# actors are org-only (also confirmed live) -- unavailable on this
# personal-account repo. Opening a PR and merging it once checks genuinely
# pass satisfies the gate for real, rather than working around it.
#
# Why a scoped PAT (README_BOT_PAT secret), not the default GITHUB_TOKEN,
# to open the PR: two GitHub Actions restrictions make a GITHUB_TOKEN-only
# design impossible here (both confirmed live 2026-08-30) -- (1) a PR opened
# via the default GITHUB_TOKEN does not itself trigger ci.yml's
# `pull_request` run (GitHub's anti-recursion rule: events authored by
# GITHUB_TOKEN never trigger further workflow runs), and (2) the default
# GITHUB_TOKEN cannot dispatch another workflow via the API either (needs a
# `workflow`-scoped token) -- so nothing could ever make the required checks
# run against a GITHUB_TOKEN-opened PR at all. README_BOT_PAT is scoped to
# ONLY this repository, with ONLY Contents:write + Pull requests:write --
# used solely to open/update this one PR, never to push `master` directly,
# so it never carries the ability to bypass review the way a broader PAT
# would. D-13's actual concern (an infinite regenerate-commit-regenerate
# loop) is closed by an orthogonal, token-independent mechanism instead:
# `[skip ci]` in the final squash-merge commit message, which GitHub honors
# for any commit regardless of which token authored it, so the merge-to-
# master itself never re-triggers this workflow's own `push` trigger.
name: readme-summary

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  regenerate-executive-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      # docs/environment.md "First-Clone Setup Gaps" -- the exact two-file
      # bootstrap every fresh clone needs before `docker compose up` (copied
      # verbatim from ci.yml's oracle-e2e job, per 06-RESEARCH.md Pattern 4
      # "reuses the same docker compose up + trigger pattern as Pattern 3" --
      # never re-derived independently, so the two workflows never silently
      # drift apart).
      - name: Recreate first-clone-only local files
        run: |
          cp .env.example .env
          mkdir -p docker/airflow
          echo '{"admin": "admin"}' > docker/airflow/simple_auth_manager_passwords.json.generated
          chmod 666 docker/airflow/simple_auth_manager_passwords.json.generated

      # Same bind-mount-creates-as-root issue as ci.yml's oracle-e2e job:
      # scripts/regenerate_readme_summary.py writes into data/customers and
      # data/orders, which would otherwise get PermissionError on a fresh
      # checkout. Pre-create with runner-user ownership.
      #
      # .staging/ subdirs are ALSO pre-created here, not left for
      # generate_csv.py's write_staged() to mkdir lazily -- live-reproduced
      # root cause (2026-09-02): this job brings up the FULL stack, scheduler
      # included, and ingestion_cascade_orchestrator's real */5 * * * *
      # schedule is not paused, so its own container-side generate_task can
      # race this job's own host-side regenerate_readme_summary.py (both call
      # write_staged()) to create .staging/ first. Whichever side creates it
      # first wins its own default mode -- the container's uid-50000-owned
      # mkdir() produces 755 (its own umask), which this job's host runner (a
      # different uid, not in group 0) then cannot write into, even though
      # airflow-init's later `chmod -R 777 /opt/airflow/data` already ran (it
      # only covers paths that existed at THAT moment -- a directory created
      # afterward is untouched by it). Confirmed live via a diagnostic run:
      # data/customers/.staging ended up `drwxrwxr-x`, owned by uid 50000, while
      # every pre-existing sibling path was `drwxrwxrwx`. Pre-creating .staging/
      # here, before docker compose up ever starts the scheduler, means
      # airflow-init's chmod -R 777 covers it too, closing the race for good.
      - name: Pre-create data/ subdirectories with correct ownership
        run: mkdir -p data/customers/.staging data/orders/.staging

      - name: Bring up the full stack
        run: docker compose up -d --wait

      - name: Dump container logs on stack failure
        if: failure()
        run: docker compose logs

      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked

      # Runs a real ingestion for both datasets, captures the deferred-wake
      # proof, queries Oracle, and splices the regenerated Executive Summary
      # into README.md -- see scripts/regenerate_readme_summary.py's module
      # docstring for the full step-by-step contract. Exits non-zero (and
      # leaves README.md untouched) on any failure, so a broken regeneration
      # fails this job loudly rather than silently leaving stale/misleading
      # evidence in place.
      - name: Regenerate README.md's Executive Summary
        run: uv run python scripts/regenerate_readme_summary.py

      - name: Tear down
        if: always()
        run: docker compose down -v

      # Fixed branch name (never per-run) so a still-open PR from a prior
      # push is updated in place rather than piling up duplicate PRs; a
      # merged/closed prior PR's branch is deleted (delete-branch: true) so
      # this recreates it fresh. token: README_BOT_PAT (see header comment)
      # -- this is what makes ci.yml's pull_request checks fire naturally.
      - name: Open PR with regenerated README.md
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.README_BOT_PAT }}
          add-paths: README.md
          branch: readme-summary/auto-update
          delete-branch: true
          commit-message: "docs(readme): regenerate Executive Summary"
          title: "docs(readme): regenerate Executive Summary"
          body: |
            Automated regeneration of README.md's live Executive Summary (D-11/D-12/D-13),
            opened by `.github/workflows/readme-summary.yml` after a real ingestion run and
            Oracle query. `lint-type-unit`/`oracle-e2e` run for real against this PR (opened
            with a repo-scoped PAT so GitHub's own pull_request trigger fires) and this PR
            merges itself automatically once both pass.

      # GitHub completes the merge itself once both real, PR-triggered
      # checks report success -- requires the repository's "Allow
      # auto-merge" setting (enabled 2026-08-30). The explicit --subject
      # carries [skip ci] so the resulting master commit never re-triggers
      # this workflow's own push trigger (see header comment).
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash \
            --subject "docs(readme): regenerate Executive Summary [skip ci]" \
            --body ""
