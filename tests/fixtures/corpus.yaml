# The fixture-corpus manifest (D-16, D-16e) — the machine-readable
# specification tools/corpus/__main__.py's `generate`/`verify` commands
# materialize and check against the committed digest oracle
# (tests/fixtures/CORPUS.sha256). `tests/fixtures/csv/**` (the generated
# bytes) is gitignored; only this file and the digest oracle are committed.
#
# Category "dialect_encoding" (02-03-PLAN.md Task 3, 8 fixtures) proves the
# tools/corpus mechanism end-to-end for the first of five planned categories
# (02-RESEARCH.md's "Recommended scoped fixture category list"). Every
# `expect:` block is free-text prose (D-16d) — never a fixed `error_code`,
# which is Phase 3/ENGINE-06's vocabulary to define, not this phase's.
version: 1
master_seed: "lightweight-airflow-etl-corpus-v1"
fixtures:
  - name: "01_semicolon_delimiter"
    category: "dialect_encoding"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ";"
      header: ["id", "name", "city"]
      rows: 3
      row_spec:
        id: {kind: zero_padded_int, width: 3, start: 1}
        name: {kind: pick, values: ["alice", "bob", "carol"]}
        city: {kind: pick, values: ["berlin", "paris", "rome"]}
    expect:
      reason: "parses correctly when the config's csv.delimiter is declared as ';'"

  - name: "02_pipe_delimiter"
    category: "dialect_encoding"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: "|"
      header: ["id", "name", "city"]
      rows: 3
      row_spec:
        id: {kind: zero_padded_int, width: 3, start: 1}
        name: {kind: pick, values: ["dave", "erin", "frank"]}
        city: {kind: pick, values: ["madrid", "oslo", "vienna"]}
    expect:
      reason: "parses correctly when the config's csv.delimiter is declared as '|'"

  - name: "03_tab_delimiter"
    category: "dialect_encoding"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: "\t"
      header: ["id", "name", "city"]
      rows: 3
      row_spec:
        id: {kind: zero_padded_int, width: 3, start: 1}
        name: {kind: pick, values: ["grace", "heidi", "ivan"]}
        city: {kind: pick, values: ["lisbon", "dublin", "krakow"]}
    expect:
      reason: "parses correctly when the config's csv.delimiter is declared as '\\t' (a literal tab character)"

  - name: "04_custom_quotechar"
    category: "dialect_encoding"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      quotechar: "'"
      header: ["id", "full_name", "note"]
      rows: 3
      row_spec:
        id: {kind: zero_padded_int, width: 3, start: 1}
        full_name: {kind: pick, values: ["Smith, John", "Doe, Jane", "Lee, Ann"]}
        note: {kind: repeat, char: "x", length: 4}
    expect:
      reason: "full_name's embedded comma forces quoting with the declared quotechar \"'\" instead of the default '\"' -- a config that hardcodes '\"' would mis-split this file's rows"

  - name: "05_escapechar_no_doublequote"
    category: "dialect_encoding"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      quotechar: "\""
      escapechar: "\\"
      doublequote: false
      header: ["id", "quote_text", "note"]
      rows: 3
      row_spec:
        id: {kind: zero_padded_int, width: 3, start: 1}
        quote_text: {kind: pick, values: ["she said \"hi\"", "he said \"bye\"", "no quote here"]}
        note: {kind: repeat, char: "y", length: 4}
    expect:
      reason: "quote_text's embedded double-quote is escaped with a backslash (escapechar), never doubled (doublequote: false) -- exercises D-02's explicit escapechar/doublequote test-coverage request"

  - name: "06_crlf_terminator"
    category: "dialect_encoding"
    generator:
      kind: literal
      encoding: utf-8
      content: "id,name,city\r\n001,jack,athens\r\n002,karl,zurich\r\n003,liam,tokyo\r\n"
    expect:
      reason: "every record is hand-joined with an explicit CRLF terminator (R4) -- never csv.writer's own default or a translated '\\n' -- so a config declaring line_terminator '\\r\\n' round-trips exactly"

  - name: "07_utf8_bom"
    category: "dialect_encoding"
    generator:
      kind: literal_unicode
      encoding: utf-8
      bom: true
      content: "id,name,city\n1,mona,cairo\n2,nora,accra\n"
    expect:
      reason: "a UTF-8 byte-order mark (EF BB BF) precedes an otherwise-plain-ASCII body -- the detector must strip the BOM before treating the first column name as 'id', not '\\ufeffid'"

  - name: "08_utf16_encoding"
    category: "dialect_encoding"
    generator:
      kind: literal_unicode
      encoding: utf-16
      content: "id,name,city\n1,omar,tunis\n2,priya,pune\n"
    expect:
      reason: "the whole file is encoded as UTF-16 (Python's own 'utf-16' codec embeds its own byte-order mark and 2-byte-per-character body) -- the encoding detector must recognize this as UTF-16, not misread it as UTF-8/Latin-1 garbage"

  # Category "structural" (02-04-PLAN.md Task 1, 8 fixtures) -- malformed
  # column shape: missing/extra/duplicate columns, wrong field count, empty
  # file, header-only, no header, ragged rows/blank lines.
  - name: "09_missing_column"
    category: "structural"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["customer_id", "name", "birth_date", "event_ts", "signup_country"]
      rows: 2
      row_spec:
        customer_id: {kind: zero_padded_int, width: 4, start: 1}
        name: {kind: pick, values: ["Amir Khan", "Bella Fox"]}
        birth_date: {kind: pick, values: ["1990-01-01", "1985-06-15"]}
        event_ts: {kind: pick, values: ["2026-01-01T00:00:00+0000", "2026-01-02T00:00:00+0000"]}
        signup_country: {kind: pick, values: ["DE", "FR"]}
    expect:
      reason: "header omits customers.json's schema-declared 'country' column entirely -- a header missing a schema-declared column"

  - name: "10_extra_unexpected_column"
    category: "structural"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["customer_id", "name", "country", "birth_date", "event_ts", "signup_country", "referral_code"]
      rows: 2
      row_spec:
        customer_id: {kind: zero_padded_int, width: 4, start: 1}
        name: {kind: pick, values: ["Carla Diaz", "Dmitri Orlov"]}
        country: {kind: pick, values: ["DE", "FR"]}
        birth_date: {kind: pick, values: ["1990-01-01", "1985-06-15"]}
        event_ts: {kind: pick, values: ["2026-01-01T00:00:00+0000", "2026-01-02T00:00:00+0000"]}
        signup_country: {kind: pick, values: ["DE", "FR"]}
        referral_code: {kind: pick, values: ["REF-100", "REF-200"]}
    expect:
      reason: "header includes 'referral_code', a column not declared in customers.json's or orders.json's schema -- an extra unexpected column"

  - name: "11_duplicate_column_name"
    category: "structural"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "customer_id", "customer_id", "amount"]
      rows: 2
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        customer_id: {kind: pick, values: ["CUST001", "CUST002"]}
        amount: {kind: decimal, scale: 2, min: 0, max: 999.99}
    expect:
      reason: "header repeats the column name 'customer_id' twice -- a duplicate column name"

  - name: "12_wrong_column_count_row"
    category: "structural"
    generator:
      kind: literal
      encoding: utf-8
      content: "order_id,customer_id,order_date,amount\nORD0001,CUST001,2026-01-01,100.00\nORD0002,CUST002,2026-01-02\nORD0003,CUST003,2026-01-03,300.00\n"
    expect:
      reason: "row 2 has only 3 fields while the header declares 4 columns -- a ragged row with the wrong column count"

  - name: "13_empty_file"
    category: "structural"
    generator:
      kind: literal
      encoding: utf-8
      content: ""
    expect:
      reason: "the file is zero bytes -- no header, no data, nothing to parse"

  - name: "14_header_only_no_rows"
    category: "structural"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "customer_id", "order_date", "amount"]
      rows: 0
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        customer_id: {kind: pick, values: ["CUST001", "CUST002"]}
        order_date: {kind: pick, values: ["2026-01-01", "2026-01-02"]}
        amount: {kind: decimal, scale: 2, min: 0, max: 999.99}
    expect:
      reason: "structurally valid, zero data rows, not an error case"

  - name: "15_no_header_row"
    category: "structural"
    generator:
      kind: literal
      encoding: utf-8
      content: "ORD0001,CUST001,2026-01-01,100.00\nORD0002,CUST002,2026-01-02,200.00\n"
    expect:
      reason: "the file has no header line at all -- config.json expects the first row to declare column names"

  - name: "16_ragged_rows_and_blank_lines"
    category: "structural"
    generator:
      kind: literal
      encoding: utf-8
      content: "order_id,customer_id,order_date,amount\nORD0001,CUST001,2026-01-01,100.00\n\nORD0002,CUST002\nORD0003,CUST003,2026-01-03,300.00,EXTRA\n\nORD0004,CUST004,2026-01-04,400.00"
    expect:
      reason: "mixes a short row (missing amount), a long row (extra field), and blank lines interspersed, with no trailing newline at end of file"

  # Category "type_nullability" (02-04-PLAN.md Task 2, 6 fixtures) -- this
  # project's own structural/type/nullability-only validation vocabulary
  # (no reference-repo file-for-file match, per 02-RESEARCH.md).
  - name: "17_invalid_integer_value"
    category: "type_nullability"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "customer_id", "quantity", "amount"]
      rows: 1
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        customer_id: {kind: repeat, char: "CUST001", length: 1}
        quantity: {kind: repeat, char: "not-a-number", length: 1}
        amount: {kind: decimal, scale: 2, min: 0, max: 999.99}
    expect:
      reason: "the fixture's only data row has quantity value 'not-a-number', not a valid integer in a column shaped like an integer column"

  - name: "18_invalid_decimal_too_many_places"
    category: "type_nullability"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "customer_id", "order_date", "amount"]
      rows: 1
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        customer_id: {kind: repeat, char: "CUST001", length: 1}
        order_date: {kind: repeat, char: "2026-01-01", length: 1}
        amount: {kind: repeat, char: "100.999", length: 1}
    expect:
      reason: "the fixture's only data row has amount value '100.999', which has 3 decimal places, exceeding orders.json's amount column's configured scale=2"

  - name: "19_invalid_date_format"
    category: "type_nullability"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["customer_id", "name", "birth_date"]
      rows: 1
      row_spec:
        customer_id: {kind: zero_padded_int, width: 4, start: 1}
        name: {kind: repeat, char: "Elin Park", length: 1}
        birth_date: {kind: repeat, char: "31/02/2026", length: 1}
    expect:
      reason: "the fixture's only data row has birth_date value '31/02/2026', which does not match customers.json's configured format '%Y-%m-%d'"

  - name: "20_invalid_timestamp_format"
    category: "type_nullability"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["customer_id", "event_ts"]
      rows: 1
      row_spec:
        customer_id: {kind: zero_padded_int, width: 4, start: 1}
        event_ts: {kind: repeat, char: "2026-01-01 00:00:00", length: 1}
    expect:
      reason: "the fixture's only data row has event_ts value '2026-01-01 00:00:00', which does not match customers.json's configured format '%Y-%m-%dT%H:%M:%S%z'"

  - name: "21_empty_required_field"
    category: "type_nullability"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["customer_id", "name", "country"]
      rows: 1
      row_spec:
        customer_id: {kind: repeat, char: "", length: 1}
        name: {kind: repeat, char: "Gina Volkov", length: 1}
        country: {kind: repeat, char: "DE", length: 1}
    expect:
      reason: "the fixture's only data row has an empty customer_id value, but customers.json declares customer_id nullable: false -- an empty required field"

  - name: "22_empty_nullable_field_should_pass"
    category: "type_nullability"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["customer_id", "name", "signup_country"]
      rows: 1
      row_spec:
        customer_id: {kind: zero_padded_int, width: 4, start: 1}
        name: {kind: repeat, char: "Ines Moreau", length: 1}
        signup_country: {kind: repeat, char: "", length: 1}
    expect:
      reason: "row 1's signup_country value is empty, which SHOULD validate cleanly since customers.json declares signup_country nullable: true -- this documents the nullable=true happy path, not an error case"

  # Category "byte_level_hard" (02-04-PLAN.md Task 3, 5 fixtures) -- RFC-4180
  # edge cases. Every column whose exact literal value is asserted in
  # `expect:` uses the `repeat` row_spec kind (a constant string, no
  # randomness) rather than `pick`, so the byte-exact content is guaranteed
  # by construction instead of depending on which candidate a `.random()`
  # draw happens to select (see 02-04-SUMMARY.md Deviations).
  - name: "23_embedded_newline_in_quoted_field"
    category: "byte_level_hard"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "note"]
      rows: 1
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        note: {kind: repeat, char: "line one\nline two", length: 1}
    expect:
      reason: "the fixture's only data row's note field contains a literal embedded newline, forcing RFC-4180 quoting so the field spans two physical lines inside one logical record"

  - name: "24_embedded_delimiter_in_quoted_field"
    category: "byte_level_hard"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "note"]
      rows: 1
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        note: {kind: repeat, char: "contains, a comma", length: 1}
    expect:
      reason: "the fixture's only data row's note field contains the configured delimiter ',' inside its value, forcing RFC-4180 quoting"

  - name: "25_doubled_quote_escaping"
    category: "byte_level_hard"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "note"]
      rows: 1
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        note: {kind: repeat, char: "she said \"hi\" again", length: 1}
    expect:
      reason: "the fixture's only data row's note field's embedded double-quote is escaped via RFC-4180 doubling (\"\") under the default doublequote: true, distinct from fixture 05's escapechar variant"

  - name: "26_embedded_nul_byte"
    category: "byte_level_hard"
    generator:
      kind: literal
      encoding: utf-8
      content: "order_id,customer_id,order_date,amount\nORD0001,CUST\0001,2026-01-01,100.00\n"
    expect:
      reason: "the customer_id field of the single data row contains a raw NUL (0x00) byte embedded in an otherwise-plain-ASCII row"

  - name: "27_oversized_field_value"
    category: "byte_level_hard"
    generator:
      kind: tabular
      encoding: utf-8
      delimiter: ","
      header: ["order_id", "big_field"]
      rows: 1
      row_spec:
        order_id: {kind: zero_padded_int, width: 4, start: 1}
        big_field: {kind: repeat, char: "x", length: 10001}
    expect:
      reason: "big_field's value is 10,001 characters, exceeding a documented 10,000-character size threshold"

  # Category "large_compressed" (02-05-PLAN.md Task 1, 3 fixtures) -- the
  # final category: one oversized streaming-generated file (D-16b) and a
  # gzip/zip-wrapped valid payload each (D-16c), completing the corpus at 30
  # fixtures across all 5 planned categories.
  - name: "28_large_streaming_profile"
    category: "large_compressed"
    generator:
      kind: tabular
      profile: large
      approx_bytes: 62915011
      encoding: utf-8
      delimiter: ","
      header: ["id", "payload"]
      rows: 62915
      row_spec:
        id: {kind: zero_padded_int, width: 8, start: 1}
        payload: {kind: repeat, char: "x", length: 990}
    expect:
      reason: "an oversized (~60 MiB / 62,915,011-byte) file generated via generators.py's batched _generate_tabular_batched path (profile: large), never materialized as a single in-memory joined buffer; approx_bytes exceeds 2x test_corpus_bounded_memory.py's 24 MiB (25,165,824-byte) RLIMIT_AS limit, mirroring the reference repo's own validated approx_bytes > 2 * rlimit_as_bytes rule -- a streaming reader must stay bounded under that cap while a naive whole-file read must not"

  - name: "29_gzip_wrapped_valid_file"
    category: "large_compressed"
    generator:
      kind: wrapper
      format: gzip
      inner:
        kind: tabular
        encoding: utf-8
        delimiter: ","
        header: ["order_id", "customer_id", "order_date", "amount"]
        rows: 20
        row_spec:
          order_id: {kind: zero_padded_int, width: 4, start: 1}
          customer_id: {kind: pick, values: ["CUST001", "CUST002", "CUST003"]}
          order_date: {kind: pick, values: ["2026-01-01", "2026-01-02", "2026-01-03"]}
          amount: {kind: decimal, scale: 2, min: 0, max: 999.99}
    expect:
      reason: "a small (~20-row) valid orders-shaped payload wrapped in gzip via gzip.GzipFile(mtime=0, filename='') -- the detector must decompress before dialect/header detection can run, and regenerating this fixture twice must produce byte-identical gzip output (R5)"

  - name: "30_zip_wrapped_valid_file"
    category: "large_compressed"
    generator:
      kind: wrapper
      format: zip
      inner:
        kind: tabular
        encoding: utf-8
        delimiter: ","
        header: ["order_id", "customer_id", "order_date", "amount"]
        rows: 20
        row_spec:
          order_id: {kind: zero_padded_int, width: 4, start: 1}
          customer_id: {kind: pick, values: ["CUST004", "CUST005", "CUST006"]}
          order_date: {kind: pick, values: ["2026-02-01", "2026-02-02", "2026-02-03"]}
          amount: {kind: decimal, scale: 2, min: 0, max: 999.99}
    expect:
      reason: "a small (~20-row) valid orders-shaped payload wrapped in zip via zipfile.ZipInfo(date_time=(1980, 1, 1, 0, 0, 0)) -- the detector must extract before dialect/header detection can run, and regenerating this fixture twice must produce byte-identical zip output (R5)"
